name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openapi-surfaces:
    name: OpenAPI tool contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGMINOS_OPENAPI_INVENTORY: inventory/openapi-surfaces.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Compare advertised tools to the vendored OpenAPI inventory
        run: npm run check:surfaces

      - name: Compare provider enums to the vendored OpenAPI inventory
        run: npm run check:providers

      - name: Contract unit tests (including drift must fail)
        run: npm test

      - name: Smoke listTools vs inventory
        run: npm run smoke

      - name: Build
        run: npm run build

      - name: Worker bundle dry-run
        run: npm run check:worker

  # Production deploy: only from main after the contract check passes. Needs repo secrets
  # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy kingminos-mcp-prod
    runs-on: ubuntu-latest
    needs: openapi-surfaces
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Smoke test (unauthenticated; no credits)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://mcp.kingminos.com/mcp -H 'content-type: application/json' -d '{}') && [ "$code" = 401 ] && break; sleep 5
          done
          [ "$code" = 401 ] || { echo "::error::unexpected status $code"; exit 1; }
      - name: Rollback hint on failure
        if: failure()
        run: echo "::warning::Roll back with 'npx wrangler rollback --name kingminos-mcp-prod'."

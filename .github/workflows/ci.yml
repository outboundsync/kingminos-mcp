name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openapi-surfaces:
    name: OpenAPI tool contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KINGMINOS_OPENAPI_INVENTORY: inventory/openapi-surfaces.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Compare advertised tools to the vendored OpenAPI inventory
        run: npm run check:surfaces

      - name: Compare provider enums to the vendored OpenAPI inventory
        run: npm run check:providers

      - name: Contract unit tests (including drift must fail)
        run: npm test

      - name: Smoke listTools vs inventory
        run: npm run smoke

      - name: Build
        run: npm run build

      - name: Worker bundle dry-run
        run: npm run check:worker

name: OpenAPI live drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-openapi:
    name: Live OpenAPI vs advertised tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fail on live OpenAPI drift
        run: npm run check:surfaces:live
        env:
          KINGMINOS_OPENAPI_JSON_URL: https://api.kingminos.com/openapi.json

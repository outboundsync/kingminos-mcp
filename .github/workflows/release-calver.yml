name: CalVer Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calver-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Generate release metadata
        id: calver
        run: node scripts/release-calver.mjs --dry-run --notes-file release-notes.md

      - name: Configure git
        if: steps.calver.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        id: tag
        if: steps.calver.outputs.has_changes == 'true'
        env:
          TAG: ${{ steps.calver.outputs.next_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$EXISTING_SHA" != "$RELEASE_SHA" ]; then
              echo "Tag $TAG already exists at $EXISTING_SHA (expected $RELEASE_SHA)." >&2
              exit 1
            fi
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists at RELEASE_SHA."
          else
            git tag -a "$TAG" -m "Release $TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: >-
          steps.calver.outputs.has_changes == 'true'
          && steps.tag.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.calver.outputs.next_tag }}
          name: ${{ steps.calver.outputs.next_tag }}
          body_path: release-notes.md
